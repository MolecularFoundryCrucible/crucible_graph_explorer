<!DOCTYPE html>
<html lang="en">
<head>
    {% block head %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link
      rel="stylesheet"
        href="https://cdn.rawgit.com/afeld/bootstrap-toc/v1.0.1/dist/bootstrap-toc.min.css"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style type="text/css">
        .mfid { color: #80858a; font-family: monospace; white-space: nowrap; }
        .mfid-copy-btn {
            opacity: 0.35; transition: opacity 0.15s;
            color: var(--bs-secondary-color); font-size: 0.85em;
            vertical-align: middle; line-height: 1;
            background: none; border: none; padding: 0 0 0 0.25em; cursor: pointer;
        }
        .mfid-copy-btn:hover { opacity: 1; color: var(--bs-body-color); }
    </style>

    <title>{% block title %}{% endblock %} - Crucible</title>
    {% endblock %}
</head>
<body data-bs-spy="scroll" data-bs-target="#toc">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.rawgit.com/afeld/bootstrap-toc/v1.0.1/dist/bootstrap-toc.min.js"></script>
    <script>
        Toc.init({
            $nav: $("#toc"), 
            $scope: $("h1, h2, h3, h4, h5, h6")
        })
    </script>

    {% block nav %}
    <nav aria-label="breadcrumb" class="sticky-top">
    <ol class="breadcrumb breadcrumb-chevron p-3 bg-body-tertiary border rounded-3">
        <li class="breadcrumb-item"><a href="/"><b>Crucible</b></a></li>
        {% block breadcrumb %}
        {% endblock %}
    </ol>
    </nav>
    
    {% endblock %}


    <div class="container-fluid mt-3 px-4" id="content">
      <div class="row">
        <!-- sidebar, which will move to the top on a small screen -->
        {% block sidebar %}
        <div class="col-sm-3">
            <nav id="toc" data-toggle="toc" class="sticky-top" style="top: 5em;"></nav>
        </div>
        {% endblock %}
        <!-- main content area -->
        <div class="{% block main_col_class %}col-sm-9{% endblock %} pe-4">  {% block content %}{% endblock %}</div>
      </div>
    </div>
    <div id="footer">
        {% block footer %}
        {% endblock %}
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.mfid').forEach(el => {
            const text = el.textContent.trim();
            if (!text) return;
            const btn = document.createElement('button');
            btn.className = 'mfid-copy-btn';
            btn.title = 'Copy ID';
            btn.innerHTML = '<i class="bi bi-clipboard"></i>';
            btn.addEventListener('click', e => {
                e.stopPropagation();
                e.preventDefault();
                navigator.clipboard.writeText(text).then(() => {
                    btn.innerHTML = '<i class="bi bi-clipboard-check" style="color:var(--bs-success);"></i>';
                    setTimeout(() => { btn.innerHTML = '<i class="bi bi-clipboard"></i>'; }, 1500);
                });
            });
            el.appendChild(btn);
        });
    });
    </script>
</body>
</html>
