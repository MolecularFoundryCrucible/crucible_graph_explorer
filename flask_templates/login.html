<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Crucible Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cg-navy:       #031e2d;
            --cg-working:    #3a7a87;
            --cg-patina:     #a8c4cd;
            --cg-text:       #1c2b38;
            --cg-muted:      #5a7385;
            --cg-border:     #ccd9e0;
            --cg-bg:         #f4f8fb;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
            background: var(--cg-bg);
            color: var(--cg-text);
            display: grid;
            place-items: center;
            min-height: 100vh;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .login-brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 2rem;
        }

        .login-brand-icon {
            flex-shrink: 0;
        }

        .login-brand-icon i {
            font-size: var(--fs-lg);
            color: var(--cg-working);
        }

        .login-brand-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--cg-navy);
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        .login-brand-name small {
            display: block;
            font-size: var(--fs-xs);
            font-weight: 400;
            color: var(--cg-muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .login-card {
            background: #fff;
            border: 1px solid var(--cg-border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(13,33,55,0.07), 0 0 0 1px rgba(13,33,55,0.04);
        }

        .login-card h1 {
            font-size: var(--fs-xl);
            font-weight: 600;
            color: var(--cg-navy);
            margin: 0 0 0.4rem;
            letter-spacing: -0.02em;
        }

        .login-card p {
            font-size: var(--fs-md);
            color: var(--cg-muted);
            margin: 0 0 1.75rem;
            line-height: 1.5;
        }

        .btn-orcid {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            padding: 0.65rem 1rem;
            background: var(--cg-working);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: var(--fs-md);
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }

        .btn-orcid:hover {
            background: #2e6370;
            color: #fff;
            text-decoration: none;
            transform: translateY(-1px);
        }

        .btn-orcid:active {
            transform: translateY(0);
        }

        .orcid-logo {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .login-divider {
            margin: 1.5rem 0 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--cg-border);
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--cg-border);
        }

        .login-divider span {
            font-size: var(--fs-xs);
            color: var(--cg-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        .login-info {
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
            font-size: var(--fs-sm);
            color: var(--cg-muted);
            background: color-mix(in srgb, var(--cg-patina) 12%, white);
            border: 1px solid var(--cg-patina);
            border-radius: 8px;
            padding: 0.75rem 0.875rem;
        }

        .login-info i {
            color: var(--cg-working);
            margin-top: 0.05rem;
            flex-shrink: 0;
        }

        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: var(--fs-sm);
            color: var(--cg-muted);
        }

        .login-footer a {
            color: var(--cg-working);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .login-bg-logo {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
        }
        .login-bg-logo img {
            width: auto;
            height: 100vh;
            opacity: 0.06;
        }
        .login-wrap {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="login-bg-logo" aria-hidden="true">
        <img src="{{ url_for('static', filename='crucible_logo.webp') }}" alt="">
    </div>
    <div class="login-wrap">
        <div class="login-brand">
            <div class="login-brand-icon">
                <img src="{{ url_for('static', filename='crucible_icon_light.svg') }}" alt="" style="width:24px; height:24px;">
            </div>
            <div class="login-brand-name">
                Crucible Web Explorer
            </div>
        </div>

        <div class="login-card">
            <h1>Sign in to continue</h1>
            <p>Access is managed through your ORCID researcher account.</p>

            <a href="{{ url_for('login_go') }}" class="btn-orcid">
                <svg class="orcid-logo" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M128 0C57.3 0 0 57.3 0 128s57.3 128 128 128 128-57.3 128-128S198.7 0 128 0z" fill="#fff" opacity="0.25"/>
                    <path d="M86.3 186.2H70.9V79.1h15.4v107.1zM108.9 79.1h41.6c39.6 0 57 28.3 57 53.6 0 27.5-21.5 53.6-56.8 53.6h-41.8V79.1zm15.4 93.3h24.5c34.9 0 42.9-26.5 42.9-39.7C191.7 111.2 178 93 148 93h-23.7v79.4zM88.7 56.8c0 5.5-4.5 10.1-10.1 10.1s-10.1-4.6-10.1-10.1c0-5.6 4.5-10.1 10.1-10.1s10.1 4.6 10.1 10.1z" fill="#fff"/>
                </svg>
                Sign in with ORCID
            </a>

            <div class="login-divider"><span>About ORCID</span></div>

            <div class="login-info">
                <i class="bi bi-info-circle-fill"></i>
                <span>ORCID provides a persistent identifier for researchers. If you don't have an account, you can <a href="https://orcid.org/register" target="_blank" rel="noopener" style="color:var(--cg-working);">create one for free</a> at orcid.org.</span>
            </div>
        </div>

        <div class="login-footer">
            Crucible Platform &mdash; <a href="https://crucible.lbl.gov" target="_blank" rel="noopener">crucible.lbl.gov</a>
        </div>
    </div>
</body>
</html>
