{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center py-5" style="min-height: 40vh;">
    <div class="display-1 fw-bold text-muted mb-2" style="font-size: 5rem; line-height:1;">{{ code }}</div>
    <p class="fs-5 text-muted mb-4" style="max-width: 480px;">{{ message }}</p>
    <a href="/" class="btn btn-outline-secondary">
        <i class="bi bi-house me-1"></i>Back to projects
    </a>
</div>
{% endblock %}
