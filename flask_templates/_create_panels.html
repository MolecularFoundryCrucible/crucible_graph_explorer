{# _create_panels.html — slide-in creation panels.
   Included via {% block panels %} in base.html. Requires `pc` and `all_projects` in context. #}
{% set pid = pc['project_id'] %}

<!-- ── shared backdrop ────────────────────────────────────────────── -->
<div id="cgPanelBackdrop" class="cg-create-panel-backdrop" onclick="cgCloseAllPanels()"></div>

<!-- ════════════════════════════════════════════════════════════════ -->
<!--  SAMPLE PANEL                                                    -->
<!-- ════════════════════════════════════════════════════════════════ -->
<div id="cgSamplePanel" class="cg-create-panel" role="dialog" aria-modal="true" aria-label="New Sample">
  <div class="cg-create-panel-header">
    <i class="bi bi-flask" style="font-size:var(--fs-xl); color:var(--cg-accent-mid);"></i>
    <span class="cg-create-panel-title">New Sample</span>
    <button class="btn-close" onclick="cgCloseAllPanels()" aria-label="Close"></button>
  </div>
  <div class="cg-create-panel-body">
    <div class="mb-3">
      <label class="form-label fw-semibold" for="sp-name">Name <span class="text-danger">*</span></label>
      <input type="text" id="sp-name" class="form-control" autocomplete="off">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold" for="sp-type">Type</label>
      <input type="text" id="sp-type" class="form-control" autocomplete="off"
             placeholder="Search or enter new…"
             oninput="cgTypeahead('sp-type','sp-type-results','{{ pid }}','sample-types')">
      <div id="sp-type-results" class="list-group mt-1" style="display:none;"></div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold" for="sp-project">Project</label>
      <select id="sp-project" class="form-select">
        {% for p in all_projects %}<option value="{{ p.project_id }}"{% if p.project_id == pid %} selected{% endif %}>{{ p.project_id }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold" for="sp-timestamp">Timestamp</label>
      <input type="datetime-local" id="sp-timestamp" class="form-control">
    </div>
    <div class="mb-3 d-flex align-items-center gap-2">
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="sp-public" role="switch">
        <label class="form-check-label fw-semibold" for="sp-public">Public</label>
      </div>
      <span class="text-muted" style="font-size:var(--fs-xs);">Make visible to all users</span>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold" for="sp-desc">Description</label>
      <textarea id="sp-desc" class="form-control" rows="2"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Scientific Metadata</label>
      <div id="sp-meta-container"></div>
      <button type="button" class="btn btn-sm btn-outline-secondary mt-1" onclick="spMeta.addRow()">
        <i class="bi bi-plus me-1"></i>Add field
      </button>
    </div>
    <div class="mb-1">
      <label class="form-label fw-semibold">Links</label>
      <div id="sp-links-container"></div>
      <button type="button" class="btn btn-sm btn-outline-secondary mt-1" onclick="spLinks.openPicker()">
        <i class="bi bi-link-45deg me-1"></i>Add link
      </button>
    </div>
  </div>
  <div class="cg-create-panel-footer">
    <button class="btn btn-primary" onclick="cgSubmitSample('{{ pid }}')" id="sp-submit">
      <i class="bi bi-plus-circle me-1"></i>Create Sample
    </button>
    <button class="btn btn-outline-secondary" onclick="cgCloseAllPanels()">Cancel</button>
    <span id="sp-error" class="text-danger small ms-auto align-self-center" style="display:none;"></span>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════ -->
<!--  PANEL JAVASCRIPT                                               -->
<!-- ════════════════════════════════════════════════════════════════ -->
<script>
// ── open / close ─────────────────────────────────────────────────────────────
function cgOpenPanel(id) {
    cgCloseAllPanels();
    document.getElementById(id).classList.add('open');
    document.getElementById('cgPanelBackdrop').classList.add('open');
    setTimeout(() => {
        const el = document.querySelector(`#${id} input[type="text"], #${id} textarea`);
        if (el) el.focus();
    }, 260);
}
function cgCloseAllPanels() {
    document.querySelectorAll('.cg-create-panel').forEach(p => p.classList.remove('open'));
    document.getElementById('cgPanelBackdrop').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') cgCloseAllPanels(); });

// ── typeahead ─────────────────────────────────────────────────────────────────
function cgTypeahead(inputId, resultsId, pid, endpoint) {
    const input   = document.getElementById(inputId);
    const results = document.getElementById(resultsId);
    const q = input.value.trim();
    if (!q) { results.style.display = 'none'; return; }
    fetch(`/${pid}/api/${endpoint}?q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(items => {
            if (!items.length) { results.style.display = 'none'; return; }
            results.innerHTML = items.map(t =>
                `<button type="button" class="list-group-item list-group-item-action py-1"
                         style="font-size:var(--fs-sm);"
                         onclick="document.getElementById('${inputId}').value=${JSON.stringify(t)};
                                  document.getElementById('${resultsId}').style.display='none';">
                    ${escHtml(t)}
                 </button>`
            ).join('');
            results.style.display = '';
        });
}

// ── submit helper ─────────────────────────────────────────────────────────────
function _cgSetSubmitting(btnId, errId, submitting, label) {
    const btn = document.getElementById(btnId);
    const err = document.getElementById(errId);
    btn.disabled = submitting;
    btn.innerHTML = submitting
        ? '<span class="spinner-border spinner-border-sm me-1"></span>Creating…'
        : label;
    err.style.display = 'none';
}

// ── datetime helpers ──────────────────────────────────────────────────────────
function _cgNowLocal() {
    const d = new Date();
    d.setSeconds(0, 0);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function _cgToISO(dtLocal) {
    if (!dtLocal) return null;
    return dtLocal.length === 16 ? dtLocal + ':00' : dtLocal;
}

// ══════════════════════════════════════════════════════════════════════════════
//  CgMetaEditor — key-value scientific metadata editor
// ══════════════════════════════════════════════════════════════════════════════
class CgMetaEditor {
    constructor(containerId) { this.el = document.getElementById(containerId); }
    addRow(key = '', val = '') {
        const row = document.createElement('div');
        row.className = 'd-flex gap-1 mb-1 align-items-center';
        row.innerHTML = `
            <input type="text" class="form-control form-control-sm cg-meta-key"
                   placeholder="Key" value="${escHtml(key)}" autocomplete="off">
            <input type="text" class="form-control form-control-sm cg-meta-val"
                   placeholder="Value" value="${escHtml(val)}" autocomplete="off">
            <button type="button" class="btn btn-sm btn-outline-danger px-2"
                    onclick="this.closest('.d-flex').remove()" title="Remove">
                <i class="bi bi-x"></i></button>`;
        this.el.appendChild(row);
    }
    export() {
        const out = {};
        this.el.querySelectorAll('.d-flex').forEach(row => {
            const k = row.querySelector('.cg-meta-key').value.trim();
            const v = row.querySelector('.cg-meta-val').value.trim();
            if (k) out[k] = v;
        });
        return Object.keys(out).length ? out : null;
    }
    reset() { this.el.innerHTML = ''; }
}

// ══════════════════════════════════════════════════════════════════════════════
//  CgLinkBuilder — unified dynamic link picker
// ══════════════════════════════════════════════════════════════════════════════
class CgLinkBuilder {
    constructor(containerId, pid, allowedTypes) {
        this.container = document.getElementById(containerId);
        this.pid = pid;
        this.types = allowedTypes;
        this.links = [];
        this._picker = null;
    }
    openPicker() {
        if (this._picker) this._picker.remove();
        const p = document.createElement('div');
        p.className = 'border rounded p-2 mb-2';
        p.style.background = 'var(--bs-tertiary-bg)';
        p.innerHTML = `
            <div class="d-flex gap-1 mb-2">
                <select class="form-select form-select-sm cg-lp-type" style="max-width:10rem;">
                    ${this.types.map(t => `<option value="${t.type}">${escHtml(t.label)}</option>`).join('')}
                </select>
                <input type="text" class="form-control form-control-sm cg-lp-search"
                       placeholder="Name or MFID…" autocomplete="off">
                <button type="button" class="btn btn-sm btn-outline-secondary px-2"
                        onclick="this.closest('.border').remove()" title="Cancel">
                    <i class="bi bi-x"></i></button>
            </div>
            <div class="cg-lp-results list-group" style="display:none; max-height:160px; overflow-y:auto;"></div>`;
        this.container.appendChild(p);
        this._picker = p;
        const searchEl  = p.querySelector('.cg-lp-search');
        const typeEl    = p.querySelector('.cg-lp-type');
        const resultsEl = p.querySelector('.cg-lp-results');
        const doSearch = () => {
            const q = searchEl.value.trim();
            const typeDef = this.types.find(t => t.type === typeEl.value);
            if (!typeDef || !q) { resultsEl.style.display = 'none'; return; }
            fetch(`/${this.pid}/api/${typeDef.endpoint}?q=${encodeURIComponent(q)}`)
                .then(r => r.json())
                .then(items => {
                    if (!items.length) { resultsEl.style.display = 'none'; return; }
                    resultsEl.innerHTML = items.map(item =>
                        `<button type="button" class="list-group-item list-group-item-action py-1"
                                 style="font-size:var(--fs-sm);"
                                 data-id="${escHtml(item.id)}" data-name="${escHtml(item.name)}">
                            <i class="bi ${escHtml(typeDef.icon)} me-1" style="font-size:0.7rem;"></i>
                            ${escHtml(item.name)}
                            <span class="text-muted ms-1 mfid" style="font-size:var(--fs-xs);">${escHtml(item.id)}</span>
                         </button>`
                    ).join('');
                    resultsEl.style.display = '';
                    resultsEl.querySelectorAll('button').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const cur = this.types.find(t => t.type === typeEl.value);
                            this._addLink(typeEl.value, btn.dataset.id, btn.dataset.name, cur.label);
                            p.remove();
                            this._picker = null;
                        });
                    });
                });
        };
        searchEl.addEventListener('input', doSearch);
        typeEl.addEventListener('change', () => { searchEl.value = ''; resultsEl.style.display = 'none'; });
        searchEl.focus();
    }
    _addLink(type, id, name, label) {
        if (this.links.some(l => l.id === id && l.type === type)) return;
        this.links.push({ type, id, name, label });
        this._render();
    }
    removeLink(type, id) {
        this.links = this.links.filter(l => !(l.id === id && l.type === type));
        this._render();
    }
    _render() {
        this.container.querySelectorAll('.cg-link-chip').forEach(el => el.remove());
        this.links.forEach(l => {
            const chip = document.createElement('span');
            chip.className = 'cg-link-chip badge rounded-pill border text-body fw-normal d-inline-flex align-items-center gap-1 me-1 mb-1';
            chip.style.cssText = 'background:var(--bs-tertiary-bg); font-size:var(--fs-xs);';
            chip.innerHTML = `<span class="text-muted" style="font-size:0.65rem;">${escHtml(l.label)}</span>${escHtml(l.name)}`;
            const closeBtn = document.createElement('button');
            closeBtn.type = 'button';
            closeBtn.className = 'btn-close';
            closeBtn.style.fontSize = 'var(--fs-2xs)';
            closeBtn.addEventListener('click', () => this.removeLink(l.type, l.id));
            chip.appendChild(closeBtn);
            this.container.insertBefore(chip, this.container.firstChild);
        });
    }
    export() { return [...this.links]; }
    reset() { this.links = []; this.container.innerHTML = ''; this._picker = null; }
}

// ── Link type definitions ─────────────────────────────────────────────────────
const SAMPLE_LINK_TYPES = [
    { type: 'sample_parent', label: 'Parent Sample', icon: 'bi-flask',    endpoint: 'samples'  },
    { type: 'sample_child',  label: 'Child Sample',  icon: 'bi-flask',    endpoint: 'samples'  },
];
const DATASET_LINK_TYPES = [
    { type: 'linked_sample',  label: 'Linked Sample',  icon: 'bi-flask',    endpoint: 'samples'  },
    { type: 'dataset_parent', label: 'Parent Dataset', icon: 'bi-database', endpoint: 'datasets' },
    { type: 'dataset_child',  label: 'Child Dataset',  icon: 'bi-database', endpoint: 'datasets' },
];
const NOTE_LINK_TYPES = [
    { type: 'linked_sample', label: 'Linked Sample', icon: 'bi-flask', endpoint: 'samples' },
];

// ── Instantiate editors and link builders ─────────────────────────────────────
const spMeta  = new CgMetaEditor('sp-meta-container');
const dsMeta  = new CgMetaEditor('ds-meta-container');
const spLinks = new CgLinkBuilder('sp-links-container', '{{ pid }}', SAMPLE_LINK_TYPES);
const dsLinks = new CgLinkBuilder('ds-links-container', '{{ pid }}', DATASET_LINK_TYPES);
const ntLinks = new CgLinkBuilder('nt-links-container', '{{ pid }}', NOTE_LINK_TYPES);

// ── submit: sample ────────────────────────────────────────────────────────────
async function cgSubmitSample(pid) {
    const name = document.getElementById('sp-name').value.trim();
    const selectedPid = document.getElementById('sp-project').value || pid;
    const errEl = document.getElementById('sp-error');
    if (!name) { errEl.textContent = 'Name is required.'; errEl.style.display = ''; return; }
    _cgSetSubmitting('sp-submit', 'sp-error', true);
    const resp = await fetch(`/${selectedPid}/api/samples/create`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            sample_name: name,
            sample_type: document.getElementById('sp-type').value.trim() || null,
            description: document.getElementById('sp-desc').value.trim() || null,
            timestamp:   _cgToISO(document.getElementById('sp-timestamp').value) || null,
            public:      document.getElementById('sp-public').checked,
            scientific_metadata: spMeta.export(),
            links: spLinks.export(),
        }),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) {
        _cgSetSubmitting('sp-submit', 'sp-error', false, '<i class="bi bi-plus-circle me-1"></i>Create Sample');
        errEl.textContent = data.error || 'Creation failed.';
        errEl.style.display = '';
        return;
    }
    window.location.href = data.url;
}

// ── submit: dataset ───────────────────────────────────────────────────────────
async function cgSubmitDataset(pid) {
    const name = document.getElementById('ds-name').value.trim();
    const selectedPid = document.getElementById('ds-project').value || pid;
    const errEl = document.getElementById('ds-error');
    if (!name) { errEl.textContent = 'Name is required.'; errEl.style.display = ''; return; }
    _cgSetSubmitting('ds-submit', 'ds-error', true);
    const resp = await fetch(`/${selectedPid}/api/datasets/create`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            dataset_name:    name,
            measurement:     document.getElementById('ds-measurement').value.trim() || null,
            instrument_name: document.getElementById('ds-instrument').value || null,
            session_name:    document.getElementById('ds-session').value.trim() || null,
            data_type:       document.getElementById('ds-datatype').value.trim() || null,
            timestamp:       _cgToISO(document.getElementById('ds-timestamp').value) || null,
            public:          document.getElementById('ds-public').checked,
            scientific_metadata: dsMeta.export(),
            links: dsLinks.export(),
        }),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) {
        _cgSetSubmitting('ds-submit', 'ds-error', false, '<i class="bi bi-plus-circle me-1"></i>Create Dataset');
        errEl.textContent = data.error || 'Creation failed.';
        errEl.style.display = '';
        return;
    }
    window.location.href = data.url;
}

// ── submit: note ──────────────────────────────────────────────────────────────
async function cgSubmitNote(pid) {
    const name = document.getElementById('nt-name').value.trim();
    const selectedPid = document.getElementById('nt-project').value || pid;
    const errEl = document.getElementById('nt-error');
    if (!name) { errEl.textContent = 'Title is required.'; errEl.style.display = ''; return; }
    _cgSetSubmitting('nt-submit', 'nt-error', true);
    const resp = await fetch(`/${selectedPid}/api/datasets/create`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            dataset_name: name,
            measurement:  'MDNote',
            links: ntLinks.export(),
        }),
    });
    const data = await resp.json();
    if (!resp.ok || data.error) {
        _cgSetSubmitting('nt-submit', 'nt-error', false, '<i class="bi bi-plus-circle me-1"></i>Create &amp; Edit Note');
        errEl.textContent = data.error || 'Creation failed.';
        errEl.style.display = '';
        return;
    }
    window.location.href = `/${selectedPid}/datasets/${data.id}/mdnote-edit`;
}

// ── open panel functions with full reset ──────────────────────────────────────
let _instrumentsLoaded = false;

function cgOpenSamplePanel() {
    document.getElementById('sp-name').value     = '';
    document.getElementById('sp-type').value     = '';
    document.getElementById('sp-desc').value     = '';
    document.getElementById('sp-public').checked = false;
    document.getElementById('sp-timestamp').value = _cgNowLocal();
    document.getElementById('sp-type-results').style.display = 'none';
    document.getElementById('sp-error').style.display = 'none';
    spMeta.reset();
    spLinks.reset();
    cgOpenPanel('cgSamplePanel');
}

function cgOpenDatasetPanel() {
    document.getElementById('ds-name').value        = '';
    document.getElementById('ds-measurement').value = '';
    document.getElementById('ds-session').value     = '';
    document.getElementById('ds-datatype').value    = '';
    document.getElementById('ds-instrument').value  = '';
    document.getElementById('ds-public').checked    = false;
    document.getElementById('ds-timestamp').value   = _cgNowLocal();
    document.getElementById('ds-measurement-results').style.display = 'none';
    document.getElementById('ds-error').style.display = 'none';
    dsMeta.reset();
    dsLinks.reset();
    cgOpenPanel('cgDatasetPanel');
    if (!_instrumentsLoaded) {
        fetch('/api/instruments')
            .then(r => r.json())
            .then(instruments => {
                _instrumentsLoaded = true;
                const sel = document.getElementById('ds-instrument');
                instruments.forEach(i => {
                    const opt = document.createElement('option');
                    opt.value = i.name; opt.textContent = i.name;
                    sel.appendChild(opt);
                });
            })
            .catch(() => {});
    }
}

function cgOpenNotePanel() {
    document.getElementById('nt-name').value = '';
    document.getElementById('nt-error').style.display = 'none';
    ntLinks.reset();
    cgOpenPanel('cgNotePanel');
}
</script>
