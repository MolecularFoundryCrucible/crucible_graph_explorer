<div class="d-flex align-items-start justify-content-between gap-3 mb-3">
    <div>
        <div class="text-uppercase text-muted fw-semibold mb-1" style="font-size:var(--fs-xs); letter-spacing:0.06em;">Project</div>
        <h1 class="fw-semibold mb-1" style="font-size:var(--fs-2xl);">Project settings</h1>
        <div class="d-flex align-items-center flex-wrap gap-2 text-muted">
            {% if project.get('title') %}<span>{{ project['title'] }}</span>{% endif %}
            <span class="mfid">{{ project_id }}</span>
        </div>
    </div>
    <a href="{{ base }}/{{ project_id }}/" class="btn btn-outline-secondary btn-sm flex-shrink-0">
        <i class="bi bi-arrow-left me-1"></i>Back to project
    </a>
</div>

<nav class="nav nav-tabs mb-4" aria-label="Project settings">
    {% if capabilities.get('can_edit') %}
    <a class="nav-link {% if active_settings_tab == 'general' %}active{% endif %}"
       href="{{ base }}/{{ project_id }}/settings">
        <i class="bi bi-sliders me-1"></i>General
    </a>
    {% endif %}
    <a class="nav-link {% if active_settings_tab == 'members' %}active{% endif %}"
       href="{{ base }}/{{ project_id }}/settings/members">
        <i class="bi bi-people me-1"></i>Members
    </a>
</nav>
