[project]
name = "crucible-graph-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "flask-pyoidc>=3.14.3",
    "flask-qrcode>=3.2.0",
    "flask-vite>=0.6.1",
    "gunicorn>=23.0.0",
    "networkx>=3.6.1",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "setuptools>=80.9.0",
    "markdown>=3.7",
    "gcsfs>=2025.3.0",
    "h5py>=3.15.1",
    "pillow>=12.1.0",
    "fsspec>=2026.2.0",
    "ncempy>=1.15",
    "cachetools>=5.0.0",
    "pydantic-ai>=1.103.0",
    "vertexai>=1.43.0",
    "nano-crucible",
    "plotly>=6.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
nano-crucible = { git = "https://github.com/MolecularFoundryCrucible/nano-crucible", rev = "dev" }
